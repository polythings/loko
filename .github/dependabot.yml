# Dependabot keeps dependencies current: one pull request a week per ecosystem with minor and patch updates, and one
# per major update. A new version is proposed once it's 7 days old (security updates at once).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      cargo: { update-types: [minor, patch] }
