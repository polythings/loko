# Checks every push to main and every pull request. Needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  hooks:
    name: Hooks (YAML, TOML, private keys, rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # rustfmt, for the rustfmt hook
      # The commit-stage hooks of .pre-commit-config.yaml; the push-stage ones (clippy) run in the jobs below.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: 0.5.7

  native:
    name: Native (format, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      # Each feature builds on its own, and with none, without warnings.
      - name: Features one at a time
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check -p loko --no-default-features
          cargo check -p loko
          cargo check -p loko --features tokio
          cargo check -p loko --features rand
          cargo check -p loko --features store
          cargo check -p loko --features object-store
          cargo check -p loko-clock --no-default-features
          cargo check -p loko-clock --features tokio
          cargo check -p loko-random --no-default-features
          cargo check -p loko-random --features getrandom
          cargo check -p loko-random --features rand
          cargo check -p loko-env
          cargo check -p loko-console
          cargo check -p loko-store
          cargo check -p loko-object-store

  wasm:
    name: WebAssembly (browser and WASI targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # from rust-toolchain.toml
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --workspace --all-features --target wasm32-wasip2 -- -D warnings
      # The JavaScript implementations on their own, and the browser build without them.
      - name: Features one at a time
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check -p loko --no-default-features --target wasm32-unknown-unknown
          cargo check -p loko --no-default-features --features js --target wasm32-unknown-unknown
          cargo check -p loko --target wasm32-wasip2
